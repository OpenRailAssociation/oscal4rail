#
# OSCAL4Rail cascade example — ONE level of the Regulatory Cascade as a NIST OSCAL profile.
#
# This profile is an OSCAL4Rail artifact (Apache-2.0). It represents the *company* level
# of the cascade: an adopting organization that selects a subset of controls from an
# upstream *industry/national* catalog. The upstream here is the BSI "Stand-der-Technik-
# Bibliothek" Grundschutz++ resolved catalog (© BSI, CC-BY-SA-4.0), which this repository
# does NOT vendor: it is fetched reproducibly from a pinned commit via
# tools/fetch_bsi_example.py (see examples/upstream/bsi/manifest.json, ADR-008 policy).
#
# Framework ≠ Content (ADR-007): this profile only SELECTS upstream controls (include-controls).
# It invents no requirement text. The statement text comes 1:1 from the upstream catalog on
# resolution (verbatim invariant preserved). Concretizing a company level with its OWN
# requirement text is owner work and belongs to the adopting organization's own repository,
# not to this framework example.
#
# Railway extension props (cascade-level, parent-catalog-ref, conformance-constraint) are
# carried under the oscal4rail ns — the NIST-sanctioned extension point — so this stays a
# valid NIST OSCAL profile. See docs/reference/cascade-as-profiles.md and
# schemas/oscal4rail/oscal4rail-profile-cascade-constraints.schema.json.

profile:
  uuid: 7b3f6e2a-9c41-4d8e-bf2a-1e7c0a9d2f44
  metadata:
    title: 'OSCAL4Rail cascade example: company profile over BSI Grundschutz++'
    published: '2026-10-19T00:00:00Z'
    last-modified: '2026-10-19T00:00:00Z'
    version: '0.1.0'
    oscal-version: 1.1.3
    props:
    - name: cascade-level
      ns: https://github.com/OpenRailAssociation/oscal4rail/ns
      value: company
    - name: parent-catalog-ref
      ns: https://github.com/OpenRailAssociation/oscal4rail/ns
      value: bsi:grundschutz-plusplus-resolved-catalog
      remarks: >-
        Stable manifest key of the upstream parent catalog, resolvable via
        examples/upstream/bsi/manifest.json (pinned commit, CC-BY-SA-4.0). The concrete
        fetched location is carried by the import/@href below.
    - name: conformance-constraint
      ns: https://github.com/OpenRailAssociation/oscal4rail/ns
      value: specializes
      remarks: >-
        Conformance flows downward (ADR-006): this company level may only specialize the
        parent, never contradict it. This prop labels the relationship declaratively; the
        validator / Change Impact layer enforces it, not this profile.
  imports:
  # href points at the fetched, pinned BSI upstream (git-ignored _fetched/, reproducible
  # via tools/fetch_bsi_example.py). It is a relative path from this profile to the
  # fetched upstream resolved catalog.
  - href: ../upstream/bsi/_fetched/grundschutz-plusplus-resolved-catalog.json
    include-controls:
    - with-ids:
      # A small, illustrative subset of real Grundschutz++ controls (verbatim IDs from the
      # upstream resolved catalog). Selection only — no requirement text is authored here.
      - GC.1.1   # Errichtung und Aufrechterhaltung eines ISMS
      - GC.1.2   # Freigabe des ISMS
      - GC.5.1   # Festlegung von Zielen für die Informationssicherheit
      - GC.6.1   # Festlegung des Geltungsbereichs
      - GC.7.1   # Vorgehen bei der Informationssicherheitseinstufung
  merge:
    as-is: true
