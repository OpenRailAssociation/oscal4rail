# The tools under tools/ are plain scripts, not an installable package. This file
# declares what they need so a contributor can reproduce the environment:
#
#   python -m venv .venv && . .venv/bin/activate
#   pip install -e ".[test]"
#   pytest
[project]
name = "oscal4rail-tools"
version = "0.3.0"
description = "Reference tooling for the OSCAL4Rail framework (validator, change tool, document generator)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    # format-nongpl: checkers for uri, uri-reference and date-time (without them
    # those formats cannot be evaluated and are reported as not checked)
    "jsonschema[format-nongpl]==4.26.0",
    "PyYAML==6.0.3",
    # Unicode property classes (\p{L}) in the OSCAL token pattern
    # (the current release needs Python 3.11; 2026.9.29 is the last one for 3.10)
    "regex==2026.11.9; python_version >= '3.11'",
    "regex==2026.9.29; python_version < '3.11'",
]

[project.optional-dependencies]
test = [
    "pytest==9.2.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Nothing is packaged: the scripts are run from the checkout.
[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-ra"
